name: Bump extension version for Dependabot PRs

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check whether the extension version already differs from main
        id: check
        run: |
          BASE_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          HEAD_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.needs_bump == 'true'

      - name: Bump patch version
        if: steps.check.outputs.needs_bump == 'true'
        run: pnpm version patch --no-git-tag-version

      - name: Commit and push the version bump
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump extension version for reladraw update"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
